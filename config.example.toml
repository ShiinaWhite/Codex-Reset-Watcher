[plugin]
enabled = true
config_version = "1.2.0"

[watcher]
# 通知群号列表：WebUI 中逐项添加，每群独立发送与独立重试。
group_ids = []
# 以下两项为内部/兼容字段（WebUI 隐藏）：group_ids_migrated 是 legacy
# 单群配置的一次性迁移标记；group_id 仅作 0.1.2 升级迁移与回滚兼容。
group_ids_migrated = false
group_id = ""
check_interval = 240
timezone = "Asia/Shanghai"
tibo_base = "https://tibo.modelyard.dev"
codex_base = "https://codex-reset.com"

[llm]
# 中文翻译（LLM enrichment，v0.1.10 translation-only）：复用 MaiBot Host
# 模型任务，对完整/截断原文做完整忠实的中文翻译（时间在翻译中本地化为
# 北京时间）；失败/超时自动降级为无翻译的普通通知，不影响告警本身。
enabled = true
# MaiBot 模型任务名（model_task_config 下的任务，如 utils/replyer）。
model_task = "replyer"
temperature = 0.2
max_tokens = 4096
# 单条告警 LLM 翻译的总预算（秒）：首次翻译+一次修复共用。
timeout_seconds = 600
# 翻译提示词（可自定义风格与要求；底层 JSON 契约不受影响）。
prompt = """请把 <SOURCE_TEXT> 中的 Tibo 原文完整、忠实地翻译成简体中文。
原文说什么就翻译什么：不要总结、压缩、删减或改写成摘要；歌词、玩笑、梗、寒暄、重复内容都要正常翻译。
按元数据把能可靠确定的时间表达自然换算成北京时间并融入译文；只输出符合契约的 JSON。"""
